[package]
name = "ptt-platform-win"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SouNdmys/POE-Trade-Tracker"
description = "Isolated Win32 platform services for POE Trade Tracker"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
