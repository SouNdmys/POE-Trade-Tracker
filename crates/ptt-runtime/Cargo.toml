[package]
name = "ptt-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Background actor runtime for POE Trade Tracker (skeleton; full port lands in P2)"

[dependencies]
ptt-core = { path = "../ptt-core" }
chrono.workspace = true
ptt-catalog = { path = "../ptt-catalog" }
ptt-market-book = { path = "../ptt-market-book" }
ptt-monitoring = { path = "../ptt-monitoring" }
ptt-ocr-onnx = { path = "../ptt-ocr-onnx" }
ptt-recognition = { path = "../ptt-recognition" }
ptt-settings = { path = "../ptt-settings" }
ptt-storage = { path = "../ptt-storage" }
ptt-trade-domain = { path = "../ptt-trade-domain" }
ptt-trade-engine = { path = "../ptt-trade-engine" }
rusqlite = { version = "0.37.0", features = ["bundled", "chrono"] }
serde_json.workspace = true

[[bin]]
name = "engine-replay-probe"
path = "src/bin/engine_replay_probe.rs"

[[bin]]
name = "watch-probe"
path = "src/bin/watch_probe.rs"
