[package]
name = "ptt-ocr-onnx"
version.workspace = true
edition = "2024"
license = "MIT"
repository = "https://github.com/SouNdmys/POE-Trade-Tracker"
description = "Offline PP-OCRv5 recognition backend for POE Trade Tracker"
rust-version = "1.88"

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-28"] }
ptt-core = { path = "../ptt-core" }
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"

[dev-dependencies]
ptt-vision = { path = "../ptt-vision" }

[[bin]]
name = "paddle-ocr-probe"
path = "src/bin/paddle_ocr_probe.rs"
