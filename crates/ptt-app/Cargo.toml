[package]
name = "ptt-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "POE Trade Tracker GPUI desktop app"
default-run = "ptt-app"

[lib]
name = "ptt_app"
path = "src/lib.rs"

[[bin]]
name = "ptt-app"
path = "src/main.rs"

# Component gallery and table-density probe. Its own binary so the states a
# live market does not happen to be in are still reachable.
[[bin]]
name = "ptt-ui-preview"
path = "src/preview.rs"

[dependencies]
gpui = "0.2"
gpui-component = "0.5"

[target.'cfg(windows)'.dependencies]
# 自更新用的四件套。async_zip 走 futures 的 IO trait,所以配 futures-lite 的
# block_on;两者本来就在 Cargo.lock 里(gpui_util 拉的),加进来不新增锁条目。
async_zip = { version = "0.0.17", features = ["deflate"] }
chrono.workspace = true
futures-lite = "2.6"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# 只要 rustls,不要 gzip:GitHub 的 zip 已经是压缩的,再套一层解压只是多一条
# 会出错的路。rustls 0.23 和 ring 是 gpui 已经带进来的那份,共用。
#
# `win-system-proxy` 是为了跟浏览器走同一条路。ureq 默认只认 `HTTPS_PROXY` 这类
# 环境变量,而 Windows 上设代理/开 VPN 的人几乎都是在"Internet 选项"里设的——那份
# 设置存在注册表,不在环境变量里。少了这个 feature,浏览器能开 GitHub、这个程序
# 却直连然后超时,而用户看到的只有一句"连不上 GitHub",完全指不到代理上去。
# 代价是多一个 winreg 0.56(MIT),只用来读那两个注册表值;同名的 0.55 早就在
# Cargo.lock 里(embed-resource 的构建依赖),所以这是一个已经审过的箱子的新版本。
# feature 在整个 workspace 上是并起来的,所以 ptt-exchange-history 那条拉小时线的
# 路也跟着走代理——正是想要的:两个 GET 应该同进同出。
ureq = { version = "3.4", default-features = false, features = [
    "rustls",
    "win-system-proxy",
] }
ptt-core = { path = "../ptt-core" }
ptt-exchange-history = { path = "../ptt-exchange-history" }
ptt-platform-win = { path = "../ptt-platform-win" }
ptt-settings = { path = "../ptt-settings" }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
ptt-monitoring = { path = "../ptt-monitoring" }
ptt-recognition = { path = "../ptt-recognition" }
ptt-runtime = { path = "../ptt-runtime" }
ptt-storage = { path = "../ptt-storage" }
ptt-trade-domain = { path = "../ptt-trade-domain" }

# build.rs 把 assets/icon.ico 编进 exe 的资源段。故意不放在
# target.'cfg(windows)' 下面：build-dependencies 的 target cfg 是按目标平台判定
# 的，跨编译到非 Windows 时它会把依赖抽掉、却留下 build.rs 里对它的引用，反而编
# 不过。所以照单收下，由 build.rs 自己看 CARGO_CFG_TARGET_OS 决定干不干活。
[build-dependencies]
winresource = "0.1"
