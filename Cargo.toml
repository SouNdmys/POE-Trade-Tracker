[workspace]
resolver = "2"
members = [
    "crates/ptt-app",
    "crates/ptt-catalog",
    "crates/ptt-core",
    "crates/ptt-monitoring",
    "crates/ptt-ocr-onnx",
    "crates/ptt-ocr-win",
    "crates/ptt-platform-win",
    "crates/ptt-recognition",
    "crates/ptt-runtime",
    "crates/ptt-settings",
    "crates/ptt-storage",
    "crates/ptt-strategy",
    "crates/ptt-trade-domain",
    "crates/ptt-trade-engine",
    "crates/ptt-market-book",
    "crates/ptt-vision",
    "crates/ptt-workflows",
]

[workspace.package]
version = "1.0.2"
authors = ["SouNd <soundmys1994@gmail.com>"]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/SouNdmys/POE-Trade-Tracker"
rust-version = "1.88"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "=0.10.9"
thiserror = "2.0.18"
uuid = { version = "1.22.0", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
opt-level = "s"
