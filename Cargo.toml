[workspace]
resolver = "2"
members = [
    "crates/ptt-catalog",
    "crates/ptt-core",
    "crates/ptt-ocr-onnx",
    "crates/ptt-ocr-win",
    "crates/ptt-platform-win",
    "crates/ptt-recognition",
    "crates/ptt-runtime",
    "crates/ptt-settings",
    "crates/ptt-vision",
]

[workspace.package]
version = "0.1.0"
authors = ["SouNd <soundmys1994@gmail.com>"]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/SouNdmys/POE-Trade-Tracker"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
opt-level = "s"
